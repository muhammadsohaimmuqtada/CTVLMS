version: '3.8'

services:
  db:
    image: mariadb:11
    container_name: ctvlms-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ctvlms_root_pass
      MARIADB_DATABASE: ctvlms
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

volumes:
  db_data:
