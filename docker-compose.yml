services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${CTVLMS_DB_ROOT_PASSWORD:?Set CTVLMS_DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${CTVLMS_DB_NAME:-ctvlms}
      MARIADB_USER: ${CTVLMS_DB_USER:-ctvlms_app}
      MARIADB_PASSWORD: ${CTVLMS_DB_PASSWORD:?Set CTVLMS_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${CTVLMS_DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/migrations/002_exposure_engine.sql:/docker-entrypoint-initdb.d/02-exposure-engine.sql:ro
      - ./database/migrations/003_remediation_verification.sql:/docker-entrypoint-initdb.d/03-remediation-verification.sql:ro
      - ./database/migrations/004_inventory_applicability.sql:/docker-entrypoint-initdb.d/04-inventory-applicability.sql:ro
      - ./database/migrations/005_nvd_sync_state.sql:/docker-entrypoint-initdb.d/05-nvd-sync-state.sql:ro
      - ./database/migrations/006_package_intelligence.sql:/docker-entrypoint-initdb.d/06-package-intelligence.sql:ro
      - ./database/migrations/007_package_candidate_separation.sql:/docker-entrypoint-initdb.d/07-package-candidates.sql:ro
      - ./database/migrations/008_remote_inventory.sql:/docker-entrypoint-initdb.d/08-remote-inventory.sql:ro
      - ./database/migrations/009_remediation_leases.sql:/docker-entrypoint-initdb.d/09-remediation-leases.sql:ro
      - ./database/migrations/010_cycle_operations.sql:/docker-entrypoint-initdb.d/10-cycle-operations.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db_data:
