# CTVLMS production-style Nginx example.
# Replace server_name, TLS paths, and PHP-FPM socket for your distribution.
# The repository root is intentionally NOT exposed as a generic static/PHP root.

server {
    listen 80;
    listen [::]:80;
    server_name ctvlms.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ctvlms.example.com;

    root /opt/ctvlms;
    server_tokens off;
    client_max_body_size 2m;

    ssl_certificate     /etc/ctvlms/tls/fullchain.pem;
    ssl_certificate_key /etc/ctvlms/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CTVLMS_TLS:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Minimal unauthenticated readiness probe. It exposes only {"status":"ok"}
    # or {"status":"unavailable"}.
    location = /healthz {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/ctvlms/healthz.php;
        fastcgi_param SCRIPT_NAME /healthz.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    # Only the dedicated public asset tree is directly readable.
    location ^~ /public/ {
        try_files $uri =404;
        access_log off;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Every application route is executed through one front controller.
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/ctvlms/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    # Never permit arbitrary repository PHP files to be addressed directly.
    location ~ \.php$ { return 404; }
    location ~ /\. { return 404; }

    access_log /var/log/nginx/ctvlms-access.log;
    error_log  /var/log/nginx/ctvlms-error.log warn;
}
