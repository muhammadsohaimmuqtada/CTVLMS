[ctvlms]
user = ctvlms
group = ctvlms
listen = /run/php/php8.4-fpm-ctvlms.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
request_terminate_timeout = 60s

clear_env = yes
env[CTVLMS_ENV] = $CTVLMS_ENV
env[CTVLMS_APP_URL] = $CTVLMS_APP_URL
env[CTVLMS_DB_HOST] = $CTVLMS_DB_HOST
env[CTVLMS_DB_PORT] = $CTVLMS_DB_PORT
env[CTVLMS_DB_NAME] = $CTVLMS_DB_NAME
env[CTVLMS_DB_USER] = $CTVLMS_DB_USER
env[CTVLMS_DB_PASSWORD] = $CTVLMS_DB_PASSWORD

php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/ctvlms/php-fpm-error.log
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.cookie_samesite] = Strict
php_admin_value[session.cookie_secure] = 1
php_admin_value[expose_php] = Off
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60
php_admin_value[post_max_size] = 2M
php_admin_value[upload_max_filesize] = 2M

chdir = /opt/ctvlms
catch_workers_output = yes
